
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=usuario
      - DB_PASSWORD=senha
      - DB_NAME=bancodados
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    volumes:
      - db_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=usuario
      - POSTGRES_PASSWORD=senha
      - POSTGRES_DB=bancodados
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d bancodados"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://usuario:senha@database:5432/bancodados?sslmode=disable
    depends_on:
      database:
        condition: service_healthy

volumes:
  db_data:
